spring:
  datasource:
    url: jdbc:postgresql://localhost:5535/eventify_db
    username: postgres
    password: postgres
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: none
    show-sql: true

  data:
    redis:
      host: ${SPRING_DATA_REDIS_HOST:localhost}
      port: 6379
  cache:
    type: redis

  liquibase:
    enabled: true
    change-log: classpath:db/changelog/db.changelog-master.yml

server:
  port: 8080

app:
  jwt:
    secret: ${JWT_SECRET}
    expirationMs: ${EXPIRATION_TIME}

  admin:
    username: ${ADMIN_USERNAME}
    password: ${ADMIN_PASSWORD}

springdoc:
  swagger-ui:
    url: /openapi.yaml
    config-url: ""