databaseChangeLog:
  - changeSet:
      id: 2
      author: shokhrukh
      comment: "Цель: Создание таблицы событий (events) для хранения информации о мероприятиях."
      #Детали: Создана таблица 'events" базовыми полями title(название), description(описание мероприятия),
      #available_tickets(число мест, доступных к бронированию), total_tickets(общее количество свободных мест),
      #date_time(время и дата начало мероприятия)
      #Важные моменты: Добавлен внешный ключ(fk_events_creator) для связи поля 'creator_id с 'user_id"
      changes:
        - createTable:
            tableName: events
            columns:
              - column:
                  name: event_id
                  type: bigint
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: title
                  type: varchar(100)
                  constraints:
                    nullable: false
              - column:
                  name: description
                  type: text
              - column:
                  name: date_time
                  type: timestamp
                  constraints:
                    nullable: false
              - column:
                  name: available_tickets
                  type: int
              - column:
                  name: total_tickets
                  type: int
                  constraints:
                    nullable: false
              - column:
                  name: creator_id
                  type: bigint
                  constraints:
                    nullable: false
                    foreignKeyName: fk_events_creator
                    referencedTableName: users
                    referencedColumnNames: id

        - createIndex:
            indexName: idx_events_creator
            tableName: events
            columns:
              - column:
                  name: creator_id

